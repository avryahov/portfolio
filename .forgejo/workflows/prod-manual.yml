name: PROD Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: docker
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: |
          set -euo pipefail
          rm -rf .git
          git init .
          git remote add origin "${CI_CLONE_URL_BASE}/${CI_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: Bearer ${CI_REPO_TOKEN}" fetch --no-tags origin "${CI_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Validate repository state
        run: bash ./scripts/ci-validate.sh

  build:
    needs: validate
    runs-on: docker
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: |
          set -euo pipefail
          rm -rf .git
          git init .
          git remote add origin "${CI_CLONE_URL_BASE}/${CI_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: Bearer ${CI_REPO_TOKEN}" fetch --no-tags origin "${CI_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build site artifact
        run: bash ./scripts/build-release.sh .build/prod

  pre-deploy-prod:
    needs: validate
    runs-on: docker
    env:
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: |
          set -euo pipefail
          rm -rf .git
          git init .
          git remote add origin "${CI_CLONE_URL_BASE}/${CI_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: Bearer ${CI_REPO_TOKEN}" fetch --no-tags origin "${CI_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Prepare SSH credentials
        run: bash ./scripts/prepare-ssh-deploy-key.sh

      - name: Pre-deploy PROD target check
        run: bash ./scripts/check-ssh-deploy-target.sh

  deploy-prod:
    needs:
      - build
      - pre-deploy-prod
    runs-on: docker
    env:
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ secrets.PROD_DEPLOY_BRANCH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SKIP_LOCAL_BRANCH_CHECK: "1"
      RELEASE_DIR: .build/prod
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: |
          set -euo pipefail
          rm -rf .git
          git init .
          git remote add origin "${CI_CLONE_URL_BASE}/${CI_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: Bearer ${CI_REPO_TOKEN}" fetch --no-tags origin "${CI_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build site artifact
        run: bash ./scripts/build-release.sh "${RELEASE_DIR}"

      - name: Prepare SSH credentials
        run: bash ./scripts/prepare-ssh-deploy-key.sh

      - name: Deploy release to PROD
        run: bash ./scripts/deploy-static-site.sh "${RELEASE_DIR}"

  smoke-prod:
    needs: deploy-prod
    runs-on: docker
    env:
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: |
          set -euo pipefail
          rm -rf .git
          git init .
          git remote add origin "${CI_CLONE_URL_BASE}/${CI_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: Bearer ${CI_REPO_TOKEN}" fetch --no-tags origin "${CI_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Prepare SSH credentials
        run: bash ./scripts/prepare-ssh-deploy-key.sh

      - name: Smoke test deployed PROD files
        run: bash ./scripts/smoke-static-deploy.sh
