name: UAT CI/CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: docker
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: bash ./scripts/checkout-forgejo-ci.sh

      - name: Validate repository state
        run: bash ./scripts/ci-validate.sh

  build-release:
    needs: validate
    runs-on: docker
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: bash ./scripts/checkout-forgejo-ci.sh

      - name: Build publishable release directory
        run: bash ./scripts/build-release.sh .build/uat

  verify-uat-target:
    needs: validate
    runs-on: docker
    env:
      DEPLOY_HOST: ${{ secrets.UAT_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.UAT_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.UAT_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.UAT_DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.UAT_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.UAT_SSH_KEY }}
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: bash ./scripts/checkout-forgejo-ci.sh

      - name: Prepare SSH credentials
        run: bash ./scripts/prepare-ssh-deploy-key.sh

      - name: Verify remote UAT target
        run: bash ./scripts/check-ssh-deploy-target.sh

  deploy-uat:
    needs:
      - build-release
      - verify-uat-target
    runs-on: docker
    env:
      DEPLOY_HOST: ${{ secrets.UAT_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.UAT_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.UAT_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.UAT_DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ secrets.UAT_DEPLOY_BRANCH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.UAT_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.UAT_SSH_KEY }}
      SKIP_LOCAL_BRANCH_CHECK: "1"
      RELEASE_DIR: .build/uat
    steps:
      - name: Checkout repository
        env:
          CI_REPO_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_CLONE_URL_BASE: http://192.168.1.77:3000
        run: bash ./scripts/checkout-forgejo-ci.sh

      - name: Build publishable release directory
        run: bash ./scripts/build-release.sh "${RELEASE_DIR}"

      - name: Prepare SSH credentials
        run: bash ./scripts/prepare-ssh-deploy-key.sh

      - name: Deploy release to UAT NAS
        run: bash ./scripts/deploy-static-site.sh "${RELEASE_DIR}"
