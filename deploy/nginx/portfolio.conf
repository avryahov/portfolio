# Nginx config template for first deploy (HTTP only).
# Path example: /etc/nginx/sites-available/portfolio.conf
#
# Why HTTP only:
# - This file must work BEFORE Let's Encrypt files exist.
# - Run certbot after this config is active:
#   certbot --nginx -d itpuh.ru -d www.itpuh.ru --redirect -m a.v.rjakhov@yandex.ru --agree-tos -n

server {
    listen 80;
    listen [::]:80;
    server_name itpuh.ru www.itpuh.ru;

    root /var/www/portfolio;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Required for Let's Encrypt HTTP challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Main routing for static MPA.
    # Supports:
    # - / (index.html)
    # - /orgmu/ (directory index)
    # - /open-solutions/leasing-calculator.html (explicit file)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets aggressively.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Keep HTML uncached for safer content updates.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # PWA manifest can be cached briefly.
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}
