# Nginx config template for the static portfolio site.
# Path example: /etc/nginx/sites-available/portfolio.conf
#
# Replace:
# - /var/www/portfolio
# - certificate paths (if they differ)

server {
    listen 80;
    listen [::]:80;
    server_name itpuh.ru www.itpuh.ru;

    # Required for Let's Encrypt HTTP challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all plain HTTP traffic to HTTPS.
    location / {
        return 301 https://itpuh.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itpuh.ru www.itpuh.ru;

    # Certbot default paths for itpuh.ru.
    ssl_certificate /etc/letsencrypt/live/itpuh.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itpuh.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canonical host: redirect www to root domain.
    if ($host = www.itpuh.ru) {
        return 301 https://itpuh.ru$request_uri;
    }

    root /var/www/portfolio;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Main routing for static MPA.
    # Supports:
    # - / (index.html)
    # - /orgmu/ (directory index)
    # - /open-solutions/leasing-calculator.html (explicit file)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets aggressively.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Keep HTML uncached for safer content updates.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # PWA manifest can be cached briefly.
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}
